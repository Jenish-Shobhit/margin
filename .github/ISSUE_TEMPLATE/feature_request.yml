name: Feature request
description: Suggest a change that makes Margin a better screenshot tool.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Margin is deliberately a focused screenshot tool: capture, save, copy, and a shelf that waits. Annotation, OCR, recording, cloud uploads, accounts and AI features are out of scope (see [CONTRIBUTING](https://github.com/Jenish-Shobhit/margin/blob/main/CONTRIBUTING.md#scope-a-focused-screenshot-tool)).
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work in Margin. Shortcuts, menu items or settings you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or how other apps handle it.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This fits a focused screenshot tool, and needs no network access or third-party dependency.
          required: true
        - label: I searched the existing issues.
          required: true
